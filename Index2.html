<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Virtual | CT</title>
    <link rel="stylesheet" href="estilos2.css">
    <link rel="shortcut icon" href="https://www.campusvirtual.com.gt/images/Logotipo-Blanco-App.ico" type="image/x-icon">
</head>
<body>
    <div class="contenedor-principal">
        <section class="panel-izquierdo">
            <div class="contenido-izquierda">
                <h2>NUEVA APP</h2>
                <h1>CAMPUS VIRTUAL</h1>
                <div class="imagen-moviles">
                    <img src="https://www.campusvirtual.com.gt/images/app_promotion_v2.gif" alt="">
                </div>
                <p>DESCARGA YA DISPONIBLE</p>
                <div class="tiendas">
                    <a href="#"><img src="https://www.campusvirtual.com.gt/images/App%20Badges/GetItOnGooglePlay_Badge_Web_color_Spanish.png" alt=""></a>
                    <a href="#"><img src="https://www.campusvirtual.com.gt/images/App%20Badges/Download_on_the_App_Store_Badge_ES_RGB_blk_100217.svg" alt=""></a>
                    <a href="#"><img src="https://www.campusvirtual.com.gt/images/App%20Badges/ExploreItOnAppGallery_Badge_Black_Spanish.png" alt=""></a>
                </div>
            </div>
        </section>
        <section class="panel-derecho">
            <div class="contenido-derecha">
                <div class="logotipo">
                    <img src="https://www.campusvirtual.com.gt/images/Logo.png" alt="">
                </div>
                <h1>¡Bienvenido a <b class="campus">Campus Virtual</b>!</h1>
                <form class="formulario-login">
                    <div class="campo">
                        <input type="text" placeholder="Usuario" required>
                    </div>
                    <div class="campo contrasena">
                        <input type="password" placeholder="Contraseña" required>
                    </div>
                    <div class="opcion-recuerdame">
                        <input type="checkbox" id="recuerdame">
                        <label for="recuerdame"><b>Recuérdame</b></label>
                    </div>
                    <button type="submit" class="boton-ingresar">Ingresar</button>
                </form>
            </div>
        </section>

    </div>
</body>
</html>
